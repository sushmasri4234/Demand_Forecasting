{% extends "base.html" %}

{% block title %}Prediction Results{% endblock %}

{% block content %}
<div class="row mt-5">
    <div class="col-md-10 offset-md-1">
        <h2>🔮 Forecast Results - Product {{ product_id }}</h2>
        <p class="text-muted">{{ n_weeks }}-week demand forecast</p>
        
        <div class="card mt-4">
            <div class="card-body">
                {{ predictions|safe }}
            </div>
        </div>
        
        <div class="mt-4">
            <a href="/predict" class="btn btn-secondary">Make Another Prediction</a>
            <a href="/dashboard" class="btn btn-primary">View Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
